[package]
name = "restore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openHC return-to-stock, run on the box: the EA's MFH revert + p1 recovery kexec, and the HC-800's one-shot GRUB factory restore."

[dependencies]
libc = "0.2"
# The EA's MFH edit and the HC-800's menu.lst rewrite are the flasher's own
# (flasher/crates/core: pure logic, unit-tested there), so the install, the
# on-box restore and `ohc-flash restore` are one implementation.
ohc-flash-core = { path = "../../flasher/crates/core" }

[[bin]]
name = "ohc-restore"
path = "src/main.rs"
