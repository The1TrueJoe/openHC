[package]
name = "iod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openHC IO server. Owns every local IO on the controller — serial, IR out/in, relays, contacts — behind one board-agnostic API."

[[bin]]
name = "iod"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "io-util", "signal", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
libc = "0.2"
# Plain MQTT to the box's mosquitto on loopback — no TLS here: reaching a
# house broker (and any TLS it needs) is mosquitto's bridge, configured from
# iod's settings (mqtt/bridge.rs).
rumqttc = { version = "0.25", default-features = false }
ohcmqtt = { path = "../ohcmqtt" }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

# GPIO is a Linux facility and this crate is Linux-only (it calls ppoll). Scoped
# to the target so `cargo check` on the maintainer's Mac still typechecks the
# rest of the daemon — that host build is the fast feedback loop, and losing it
# to a dependency that could never run there would be a bad trade.
[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.8"
