[package]
name = "portal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openHC captive-portal Wi-Fi setup app. A standalone web app, separate from the dashboard; runs only while the setup AP is up and serves the setup page + join API on :80."

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wifi = { path = "../wifi" }
