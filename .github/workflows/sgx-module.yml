# Fast iteration for the SGX545 kernel driver (pvrsrvkm.ko).
#
# A full image build is ~4h. A driver-only change needs only the KERNEL rebuilt:
# restore the cached Buildroot output tree (host toolchain + already-built packages;
# build.sh trims build/linux-* so the kernel is always re-extracted + rebuilt) and
# run `linux-rebuild` -- ~5-10 min, yielding a fresh pvrsrvkm.ko for the current
# submodule source, hot-swappable on the running kernel (same vermagic).
#
# SELF-SEEDING: GitHub LRU-evicts the (multi-GB) out-ea1-v1 tree during multi-hour
# gaps between runs. Rather than hard-fail on a miss, this job does the full build
# itself (which also produces the .ko) and re-saves the tree. And EVERY run re-saves
# the tree under a fresh key, refreshing its recency so active iteration keeps it warm.
# See [[c4-ea-sgx-wpe-64bit]].
name: sgx-module

on:
  workflow_dispatch:
  push:
    branches: [ea1-gpu-2026]
    paths:
      - board/ea/common/kernel/drivers/gpu/drm/sgx545ce
      - .github/workflows/sgx-module.yml

env:
  BUILDROOT_REF: 2026.02.3

jobs:
  pvrsrvkm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Restore Buildroot downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ env.BUILDROOT_REF }}-restore
          restore-keys: |
            dl-${{ env.BUILDROOT_REF }}-

      - name: Restore the Buildroot output tree (host toolchain + packages)
        id: outcache
        uses: actions/cache/restore@v4
        with:
          path: output/build/ea1-v1
          key: out-ea1-v1-${{ env.BUILDROOT_REF }}-r3-restore
          restore-keys: |
            out-ea1-v1-${{ env.BUILDROOT_REF }}-r3-

      - name: Clone Buildroot + apply openHC's buildroot patches
        run: |
          set -e
          git clone --depth 1 --branch "$BUILDROOT_REF" \
            https://github.com/buildroot/buildroot "$HOME/buildroot"
          for p in build/buildroot-patches/*.patch; do
            [ -e "$p" ] || continue
            patch -d "$HOME/buildroot" -p1 --forward --batch < "$p" || true
          done

      - name: Build kernel + SGX driver (full seed on cache miss, else linux-rebuild)
        run: |
          set -euxo pipefail
          if [ -d output/build/ea1-v1/host/bin ]; then
            echo ">> cache hit: linux-rebuild only (~5-10 min)"
            BUILDROOT_DIR="$HOME/buildroot" BOARD=ea1-v1 bash ./build/build.sh linux-rebuild
          else
            echo ">> cache MISS: full seed build (~hours; also re-seeds the tree cache)"
            BUILDROOT_DIR="$HOME/buildroot" BOARD=ea1-v1 bash ./build/build.sh
          fi
          ko=output/build/ea1-v1/build/linux-7.1.8/drivers/gpu/drm/sgx545ce/pvrsrvkm.ko
          ls -l "$ko"
          mkdir -p out
          cp "$ko" out/pvrsrvkm.ko
          for m in drm.ko drm_panel_orientation_quirks.ko; do
            f=$(find output/build/ea1-v1/build/linux-7.1.8 -name "$m" | head -1)
            [ -n "$f" ] && cp "$f" out/ || true
          done
          cp output/build/ea1-v1/build/linux-7.1.8/arch/x86/boot/bzImage out/ 2>/dev/null || true
          ls -l out/

      # The EA "real" (fat) kernel: a second out-of-tree compile of the same source
      # with DRM/SGX built IN (board/ea/common/linux/real-kernel.fragment). This is
      # the kexec target staged on p1 — no 7 MB limit. Produced here for a low-risk
      # kexec test on the box before it is wired into the image/boot path.
      - name: Build the EA real (fat) kernel
        run: |
          set -euxo pipefail
          bash ./build/mk-real-kernel.sh "$PWD/output/build/ea1-v1" "$PWD" "$PWD/out/bzImage-real"
          ls -l out/bzImage-real

      # Same trim as images.yml: build/linux-* is re-extracted every build, images/ is
      # pure output. target/ and staging/ MUST stay (package stamps live there).
      - name: Trim the output tree before caching
        if: always()
        run: |
          O=output/build/ea1-v1
          [ -d "$O" ] || exit 0
          rm -rf "$O"/build/linux-* "$O"/images
          echo ">> cacheable tree: $(du -sh "$O" 2>/dev/null | cut -f1)"

      # Re-save on EVERY run (fresh run_id key) to refresh recency and resist LRU
      # eviction during gaps — this is the fix for the recurring ~2-3h cache loss.
      - name: Save the Buildroot output tree
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/build/ea1-v1
          key: out-ea1-v1-${{ env.BUILDROOT_REF }}-r3-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: pvrsrvkm
          path: out/
          retention-days: 7
