# Cross-build the IO-processor firmware for both microcontroller families.
#
# This exists because the firmware is the one part of openHC that CANNOT be
# compile-checked on a normal developer machine: it needs arm-none-eabi-gcc, and
# the maintainer's Mac does not have it. The LM3S1162 tree was written and
# reviewed without ever being compiled, which is exactly the situation CI is for
# — a firmware that does not build is not a firmware, and the failure mode on
# real hardware (a part that takes an image and then does nothing) gives you no
# clue which it was.
#
# It is deliberately NOT part of images.yml. That workflow is a 45-minute
# Buildroot matrix; this is a 30-second cross-compile, and coupling them means
# either waiting three quarters of an hour to learn about a typo, or skipping
# the check when only firmware changed.

name: io-mcu

on:
  push:
    paths: &mcu-paths
      - 'board/*/firmware/io-mcu/**'
      - '.github/workflows/io-mcu.yml'
  pull_request:
    paths: *mcu-paths
  workflow_dispatch:

concurrency:
  group: io-mcu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The EA tree emits a bare .bin; the HC-800 tree wraps it in
          # Control4's container, so it gets the `image` target and a CRC check.
          - name: tm4c1231d5-ea1
            dir: board/ea-common/firmware/io-mcu/tm4c1231d5
            target: fw
            args: BOARD=ea1
          - name: tm4c1231d5-ea3
            dir: board/ea-common/firmware/io-mcu/tm4c1231d5
            target: fw
            args: BOARD=ea3
          - name: lm3s1162-hc800
            dir: board/hc800/firmware/io-mcu/lm3s1162
            target: image
            args: BOARD=hc800

    steps:
      - uses: actions/checkout@v4

      # Ubuntu's gcc-arm-none-eabi is a full bare-metal cross toolchain; we link
      # -nostdlib and supply our own libc_min, so no newlib is needed.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Build ${{ matrix.name }}
        run: make -C ${{ matrix.dir }} ${{ matrix.target }} ${{ matrix.args }}

      # `make size` (invoked by the build) already refuses to call an image
      # flashable if the vector table is wrong. This re-checks the container's
      # CRC independently for the boards that build one, because a good ELF
      # inside a mis-wrapped container is still a brick.
      - name: Verify the flashable container
        if: matrix.target == 'image'
        run: make -C ${{ matrix.dir }} verify

      # Prove the packer against Control4's OWN image, not just our own output.
      # If mkimage.py's CRC ever stops reproducing the stock image's 0xa578, the
      # container format has drifted and anything we flash is suspect.
      - name: Check the packer still reproduces the STOCK image's CRC
        if: matrix.name == 'lm3s1162-hc800'
        run: |
          python3 board/hc800/firmware/io-mcu/lm3s1162/tools/mkimage.py --verify \
            board/hc800/firmware/io-mcu/lm3s1162/vendor/700-00165_LM3S1162_IoProcMultiConfig1162_03.26.15_2.8.0.507079-fw.bin

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: io-mcu-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/build/*/io-mcu.elf
            ${{ matrix.dir }}/build/*/io-mcu.bin
            ${{ matrix.dir }}/build/*/io-mcu-fw.bin
            ${{ matrix.dir }}/build/*/io-mcu.map
          retention-days: 14
          if-no-files-found: error
