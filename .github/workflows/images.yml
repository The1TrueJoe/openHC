# Build openHC images for every board.
#
# Runs Buildroot DIRECTLY on the runner rather than through build/Dockerfile.
# That is deliberate: the Dockerfile keeps sources off a developer's machine,
# but in CI it actively hurts, because Buildroot's dl/ and output/ live in
# BuildKit cache mounts and cache mounts are NOT exported by any of the GitHub
# cache backends. Run it natively and actions/cache can hold the one thing worth
# holding. build/build.sh takes BUILDROOT_DIR, so it does not care either way.
#
# What is shared, and why that is the whole point: every board re-downloads the
# same ~GB of upstream tarballs, so dl/ is cached once under a key that ignores
# the board entirely. The toolchain is NOT shared -- each board builds its own,
# in parallel. That is a deliberate trade: sharing a toolchain across boards
# means an external-toolchain tarball and a second pipeline to maintain, and
# this repo is public, so runner minutes are free. Wall-clock is what matters,
# and parallel matrix jobs already give us that.

name: images

on:
  # These are exactly the paths the `select` job below inspects, so a push
  # outside them would only ever resolve to an empty board list. Pull requests
  # are NOT filtered: `images-ok` must report on every PR for branch protection,
  # and `select` resolves an unrelated change to no boards in seconds.
  push:
    branches: [main]
    paths:
      - 'board/**'
      - 'packages/**'
      - 'build/**'
      - 'flasher/**'      # post-image calls ohc-flash
      - 'Makefile'
      - '.github/workflows/images.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: "Single board to build (blank = all)"
        required: false
        default: ""
  # Publishing a release rebuilds and attaches the images to it, named by tag.
  release:
    types: [published]
  schedule:
    # Weekly full matrix: catches upstream breakage (a Buildroot mirror going
    # away, a package bumping) that lands on a week nobody touched a board.
    # Was nightly, but eight boards every night is a lot of runner time for a
    # tree that rarely moves; once a week (Monday 04:00 UTC) still surfaces a
    # broken mirror long before it matters, and anything actually pushed is
    # built on its own PR regardless.
    - cron: "0 4 * * 1"

# A second push supersedes the first; there is no value in finishing an image
# for a commit that is already history.
concurrency:
  group: images-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# gh needs write access to attach the image bundles to a release.
permissions:
  contents: write

env:
  BUILDROOT_REF: 2026.02.3

jobs:
  # Which boards does this change actually affect? Everything below board/ is
  # board-scoped except the shared trees, so a CA-1 change has no business
  # rebuilding five EA images.
  select:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.pick.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Seconds, before any multi-hour build: every board.env and init script
      # must at least PARSE. board.env is sourced by nearly every init script
      # (networking included), so one bad line there yields an image that
      # boots to a login prompt with no network — found the hard way.
      - name: Shell syntax (board.env, init scripts, helpers)
        shell: bash
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            sh -n "$f" || { echo "::error file=$f::shell syntax error"; bad=1; }
          done < <(git ls-files 'board/**/board.env' 'board/**/etc/init.d/*' 'board/**/opt/ohc/bin/*' 'board/**/opt/ohc/libexec/*' \
                   | while read -r f; do head -c 64 "$f" | grep -q '^#!.*sh' && echo "$f" || case "$f" in *board.env) echo "$f";; esac; done)
          exit $bad

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          ALL='["ea1-v1","ea1-v2","ea1-v2-poe","ea3-v1","ea3-v2","ioxv1","ca1","hc800"]'

          # Explicit request, or a scheduled/dispatch run with no board: build all.
          if [ -n "${{ github.event.inputs.board }}" ]; then
            echo "boards=[\"${{ github.event.inputs.board }}\"]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "boards=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # First push to a branch has no usable base; build everything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "boards=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # Shared trees affect every board. build/ and the flasher are in here
          # because build.sh drives the build and post-image calls ohc-flash.
          if echo "$changed" | grep -qE '^(board/common/|board/Config\.in|board/external\.|packages/|build/|flasher/|Makefile)'; then
            echo "boards=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          sel=()
          # ea/common is shared by the EA family only.
          if echo "$changed" | grep -qE '^board/ea/common/'; then
            sel+=(ea1-v1 ea1-v2 ea1-v2-poe ea3-v1 ea3-v2)
          fi
          # EA boards live under board/ea/<board>/; the others are top-level.
          for b in ea1-v1 ea1-v2 ea1-v2-poe ea3-v1 ea3-v2; do
            echo "$changed" | grep -qE "^board/ea/$b/" && sel+=("$b")
          done
          for b in ioxv1 ca1 hc800; do
            echo "$changed" | grep -qE "^board/$b/" && sel+=("$b")
          done
          # Workflow-only or docs-only change: nothing to build.
          if [ ${#sel[@]} -eq 0 ]; then
            echo "boards=[]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf -v j '"%s",' $(printf '%s\n' "${sel[@]}" | sort -u)
          echo "boards=[${j%,}]" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.boards != '[]'
    runs-on: ubuntu-latest
    # Buildroot from cold is long; the hard ceiling is 6 h and a job killed at
    # the limit leaves no artifact and no useful log tail.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.select.outputs.boards) }}
    steps:
      # sgx545-ce is a submodule and board/Config.in sources its Config.in
      # unconditionally, so defconfig fails for every board without it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/webd/ui/package-lock.json

      # The daemons are cross-compiled and STAGED INTO THE ROOTFS OVERLAY before
      # Buildroot runs, because that is where packages/build.sh puts them and
      # where the image picks them up. Without this the overlay directory is
      # empty and every image ships with no iod and no webd — the init scripts
      # report "not installed" and the box boots with no IO server and no GUI.
      # That was true of every image built before this step existed.
      - name: Stage the openHC daemons into the rootfs overlay
        run: |
          set -euo pipefail
          # Globs, so a future hc800-v2 or ca1-v2 does not fall through to the
          # EA default and get silently cross-compiled for the wrong arch. This
          # is only the C-shim compiler and its headers; which LINKER each
          # target uses lives in packages/.cargo/config.toml, and build.sh
          # refuses to run for a target that has no entry there.
          case "${{ matrix.board }}" in
            hc800*) target=x86_64-unknown-linux-musl;      cc=musl-gcc;                  apt="musl-tools" ;;
            ca1*)   target=armv7-unknown-linux-musleabihf; cc=arm-linux-gnueabihf-gcc;   apt="gcc-arm-linux-gnueabihf libc6-dev-armhf-cross" ;;
            ioxv1*) target=armv5te-unknown-linux-musleabi; cc=arm-linux-gnueabi-gcc;     apt="gcc-arm-linux-gnueabi libc6-dev-armel-cross" ;;
            *)      target=i686-unknown-linux-musl;        cc=i686-linux-gnu-gcc;        apt="gcc-i686-linux-gnu libc6-dev-i386-cross" ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $apt
          rustup target add "$target"
          # ring compiles a few C shims; same reasoning as daemons.yml.
          export "CC_$(echo "$target" | tr '-' '_')=$cc"
          bash ./packages/build.sh "${{ matrix.board }}"
          ls -l board/common/rootfs-overlay/opt/ohc/bin/

      # Same list as build/Dockerfile. If that changes, change it here too --
      # they are two copies of one fact, and CI is the one that fails loudly.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex git rsync unzip wget cpio file figlet \
            python3 libncurses-dev libssl-dev ca-certificates perl patch xz-utils

      # The one genuinely shared artefact. Keyed on the board files that pin
      # versions, NOT on the board, so all eight matrix jobs hit the same entry.
      # restore-keys means a version bump reuses the previous download set and
      # fetches only what actually moved.
      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ env.BUILDROOT_REF }}-${{ hashFiles('board/**/*_defconfig', 'packages/**/*.mk', 'packages/**/*.hash') }}
          restore-keys: |
            dl-${{ env.BUILDROOT_REF }}-

      # The expensive thing is the CROSS TOOLCHAIN, and it is identical on every
      # run: host-gcc-initial and host-gcc-final are ~15 of the ~33 minutes, and
      # nothing in this repo changes their config from one commit to the next.
      # Caching dl/ above only saves the download, not a single compiled object.
      #
      # Safe to reuse because build/build.sh already defends the two ways an
      # incremental Buildroot tree goes wrong:
      #   * it WIPES $OUT when the resolved toolchain config changes, and again
      #     when the on-disk compiler cannot do what .config claims;
      #   * it runs `linux-dirclean` every time, so the kernel is always
      #     re-extracted, re-patched and re-injected with our drivers — an
      #     edit to board/*/kernel never rides on a stale stamp.
      #
      # Rolling key: the run id makes every run save a fresh entry, and
      # restore-keys picks up the newest previous one.
      # restore/save split rather than actions/cache, because the plain action
      # does NOT save when the job fails — and a failed build is exactly when
      # the toolchain is most worth keeping. A typo in a driver should cost one
      # kernel rebuild, not another 15 minutes of gcc.
      # CACHE EPOCH — bump this when a PACKAGE's config changes in a way
      # Buildroot's per-package stamps do not notice (a cached package is not
      # rebuilt just because the defconfig that selects its options changed). The
      # kernel is safe (linux-dirclean runs every build), but packages are not:
      # r2 forced one clean rebuild after round 2 added dbus, so avahi rebuilt
      # with libavahi-client (shairport-sync needs it) instead of riding the
      # pre-round-2 dbus-less avahi in the cache. r3 goes with the move to
      # Buildroot 2026.02.3 (the ref is in the key too, so this is belt and braces).
      - name: Restore Buildroot output tree
        id: outcache
        uses: actions/cache/restore@v4
        with:
          path: output/build/${{ matrix.board }}
          key: out-${{ matrix.board }}-${{ env.BUILDROOT_REF }}-r3-${{ github.run_id }}
          restore-keys: |
            out-${{ matrix.board }}-${{ env.BUILDROOT_REF }}-r3-

      # The EA family shares ONE ccache, keyed on the family rather than the
      # board, so a translation unit compiled for ea1-v2 (WebKit, ICU, the
      # toolchain's own host-gcc) is a hit for every other EA board and every
      # later run. The rolling run_id key saves a fresh entry each run and the
      # restore-keys walk back: this board's newest ccache first, then any EA
      # board's. restore/save split (not plain actions/cache) so a FAILED build
      # still saves the objects it did compile — the save step runs on always().
      - name: Restore the EA family ccache
        if: startsWith(matrix.board, 'ea')
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ea-${{ env.BUILDROOT_REF }}-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: |
            ccache-ea-${{ env.BUILDROOT_REF }}-${{ matrix.board }}-
            ccache-ea-${{ env.BUILDROOT_REF }}-

      - name: Fetch Buildroot
        run: |
          set -e
          git clone --depth 1 --branch "$BUILDROOT_REF" \
            https://github.com/buildroot/buildroot "$HOME/buildroot"
          for p in build/buildroot-patches/*.patch; do
            [ -e "$p" ] || continue
            echo ">> buildroot patch: ${p##*/}"
            patch -d "$HOME/buildroot" -p1 --forward --batch < "$p"
          done

      # The version string CI stamps into the image and reuses as the bundle
      # name: the release tag on a release, else <short-sha>-dev. post-build.sh
      # reads OHC_VERSION and writes it into /etc/openhc-release so the flasher
      # can compare an installed box against the latest release.
      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
          else
            v="$(git rev-parse --short HEAD)-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "openHC version: $v"

      - name: Build ${{ matrix.board }}
        env:
          BUILDROOT_DIR: ${{ github.workspace }}/../buildroot
          BOARD: ${{ matrix.board }}
          OHC_VERSION: ${{ steps.ver.outputs.version }}
          # Shared ccache dir for the EA family (see the restore/save steps and
          # board/ea/common/common_defconfig). build.sh forwards it to make only
          # when set; a board whose defconfig has no BR2_CCACHE ignores it.
          BR2_CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -e
          # build.sh caps parallelism by RAM; the runner has 4 cores / 16 GB.
          # OHC_VERSION is exported here so Buildroot's post-build hook stamps it.
          BUILDROOT_DIR="$HOME/buildroot" BOARD="${{ matrix.board }}" \
            OHC_VERSION="${{ steps.ver.outputs.version }}" bash ./build/build.sh

      # The HC-800's first install starts openHC from the RUNNING Control4 image
      # with kexec (writes nothing). Control4 never shipped the userspace tool,
      # and the vendor userland is 32-bit glibc, so the bundle carries a static
      # i686 kexec the flasher pushes when the box has none. Same recipe as
      # tools.yml, built here so every hc800 release is self-sufficient instead
      # of depending on a separate artifact that expires.
      - name: Static i686 kexec (HC-800 stock-side launch)
        if: success() && matrix.board == 'hc800'
        env:
          KEXEC_VERSION: "2.0.31"
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          wget -q "https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kexec/kexec-tools-${KEXEC_VERSION}.tar.xz"
          tar xf "kexec-tools-${KEXEC_VERSION}.tar.xz"
          ( cd "kexec-tools-${KEXEC_VERSION}" && ./configure --host=i686-pc-linux-gnu \
              --build=x86_64-pc-linux-gnu CC="gcc -m32" LDFLAGS="-static" \
              --without-zlib --without-lzma --without-xen >/dev/null && make -j"$(nproc)" >/dev/null )
          out="output/build/${{ matrix.board }}/images/kexec-i686-static"
          cp "kexec-tools-${KEXEC_VERSION}/build/sbin/kexec" "$out"
          file "$out" | grep -q "ELF 32-bit.*Intel 80386" || { echo "not i386"; exit 1; }
          file "$out" | grep -q "statically linked" || { echo "not static"; exit 1; }
          ls -l "$out"

      # Bundle the images into one zip the flasher can consume directly
      # (Release::open reads the canonical filenames inside — bzImage,
      # rootfs.ext2, ...). output/ also holds the multi-GB build tree and
      # target/, which is of no use to anyone downloading this, so only images/
      # goes in. The bundle name carries the version: openhc-<board>-<version>.
      - name: Bundle images
        if: success()
        id: bundle
        run: |
          bundle="openhc-${{ matrix.board }}-${{ steps.ver.outputs.version }}.zip"
          # build.sh writes to output/build/$BOARD/images, NOT output/images —
          # it keeps a per-board output tree so switching boards does not force
          # a full rebuild. This step looked in output/images and so had never
          # produced an artifact for ANY board; every green build still ended
          # here with "cd: output/images: No such file or directory".
          imgdir="output/build/${{ matrix.board }}/images"
          if [ ! -d "$imgdir" ]; then
            echo "no images at $imgdir — build.sh layout changed?"
            find output -maxdepth 4 -name images -type d 2>/dev/null
            exit 1
          fi
          ls -l "$imgdir"
          # Absolute destination: a relative one is interpreted from inside
          # $imgdir, which is four levels down, not two.
          ( cd "$imgdir" && zip -r -X "$GITHUB_WORKSPACE/$bundle" . )
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          ls -l "$bundle"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          # Per-OS-unique artifact name (v4 requires it); the zip inside carries
          # the versioned bundle name.
          name: openhc-${{ matrix.board }}
          path: ${{ steps.bundle.outputs.bundle }}
          retention-days: 14
          if-no-files-found: error

      # Carry-forward store (main only). A newer push to main cancels the older
      # run (see `concurrency`), and `select` then rebuilds only the boards THIS
      # push changed — so without this, the boards the cancelled run had already
      # built would vanish from the newest run's output. Each successful main
      # build parks its bundle in a per-board cache under a stable `carry/` dir;
      # the `carry-forward` job below republishes it for any board the newest run
      # did not rebuild, so main always has a complete, current image set.
      - name: Persist this board's image for carry-forward (main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p carry
          cp "${{ steps.bundle.outputs.bundle }}" carry/
      - name: Save carry-forward image (main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: carry
          key: img-main-${{ matrix.board }}-${{ github.run_id }}

      # Drop only what is genuinely rebuilt. That is a shorter list than it
      # looks:
      #
      #   build/linux-*  yes — build.sh runs linux-dirclean every time, so the
      #                  kernel is re-extracted, re-patched and re-injected with
      #                  our drivers on every build regardless.
      #   images/        yes — pure output, and already uploaded above.
      #   target/        NO. This looked regenerable and is not: packages
      #                  install INTO it, and their stamps say "installed", so a
      #                  restored tree without it never refills it and the build
      #                  dies at target-finalize with
      #                  "sed: can't read .../target/etc/hosts".
      #   staging/       NO, for the same reason.
      - name: Trim the output tree before caching
        if: always()
        run: |
          O=output/build/${{ matrix.board }}
          [ -d "$O" ] || exit 0
          rm -rf "$O"/build/linux-* "$O"/images
          echo ">> cacheable tree: $(du -sh "$O" 2>/dev/null | cut -f1)"

      - name: Save Buildroot output tree
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/build/${{ matrix.board }}
          key: out-${{ matrix.board }}-${{ env.BUILDROOT_REF }}-r3-${{ github.run_id }}

      # Save the shared EA ccache on always(): even a failed build compiled
      # objects worth keeping for the next run, and a typo deep in WebKit should
      # not cost that work. ccache caps itself (--max-size in the defconfig), so
      # this never grows without bound.
      - name: Save the EA family ccache
        if: always() && startsWith(matrix.board, 'ea')
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ea-${{ env.BUILDROOT_REF }}-${{ matrix.board }}-${{ github.run_id }}

      # On a release, attach the bundle so the flasher can pull the latest image
      # for a board straight from the release.
      - name: Attach to release
        if: success() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.bundle.outputs.bundle }}" --clobber

      # A build that fails deep in a package leaves the reason in Buildroot's
      # log, not in the step output, and without this you re-run the whole
      # thing blind just to read it.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.board }}
          path: |
            output/build/*/build/*/config.log
            output/build/${{ matrix.board }}/*.log
          retention-days: 7
          if-no-files-found: ignore

  # The rolling `dev` pre-release: the dev update channel (ohc-update on the
  # box; stable is a published release, which `Attach to release` fills). CI
  # artifacts need a GitHub token to download; release assets do not, so a box
  # can fetch these directly. A push rebuilds only the boards it touches, so
  # each board's zip is replaced on its own and the others stay — the zip names
  # carry their own versions (openhc-<board>-<sha>-dev.zip). The `dev` tag
  # follows the newest commit that published.
  dev-release:
    name: dev release
    needs: [select, build]
    # Whatever built: one board failing must not hold back the others' images
    # (only successful boards upload an artifact).
    if: >-
      !cancelled() && needs.select.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openhc-*
          path: bundles
          merge-multiple: true
      - name: Publish to the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l bundles
          # The tag first (create, or move it here), then the release on it.
          if gh api "repos/$GH_REPO/git/refs/tags/dev" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Rolling development builds of main — the dev update channel. Each board's image is replaced when a commit that affects it builds, so the zips can come from different commits; the version is in each name (openhc-<board>-<sha>-dev.zip). Not a release: for that, use the latest published one."
          gh release view dev >/dev/null 2>&1 || \
            gh release create dev --prerelease --title "dev (rolling)" --notes "$notes"
          existing=$(gh release view dev --json assets -q '.assets[].name')
          for z in bundles/openhc-*.zip; do
            n=$(basename "$z")
            # openhc-<board>-<version>.zip: the board is everything before the
            # version, which starts with the 7-hex short sha.
            board=$(echo "$n" | sed -E 's/^openhc-(.*)-[0-9a-f]{7,}-dev\.zip$/\1/')
            for old in $(echo "$existing" | grep -E "^openhc-${board}-[0-9a-f]{7,}-dev\.zip$" || true); do
              [ "$old" = "$n" ] || gh release delete-asset dev "$old" --yes
            done
            gh release upload dev "$z" --clobber
            echo "dev: $n"
          done

  # Republish the latest image for every board the newest main run did NOT
  # rebuild, pulled from the per-board carry-forward cache the build job fills.
  # This is what lets a newer push to main cancel the older run (see
  # `concurrency`) without the boards that run had already built dropping out:
  # main ends every run with a complete, current image set.
  #
  # Best-effort, and deliberately NOT in images-ok's needs: a cold cache (no
  # prior image for a board yet) just means nothing to carry, never a failed
  # required check.
  carry-forward:
    needs: [select, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same fleet as select's ALL; a board added there is added here.
        board: [ea1-v1, ea1-v2, ea1-v2-poe, ea3-v1, ea3-v2, ioxv1, ca1, hc800]
    steps:
      # A board this run built already uploaded openhc-<board>; re-uploading the
      # same artifact name would collide, so carry forward only the rest.
      - name: Did this run build ${{ matrix.board }}?
        id: built
        run: echo "built=${{ contains(fromJSON(needs.select.outputs.boards), matrix.board) }}" >> "$GITHUB_OUTPUT"

      - name: Restore last main image for ${{ matrix.board }}
        if: steps.built.outputs.built == 'false'
        uses: actions/cache/restore@v4
        with:
          path: carry
          # No per-run key can match an earlier run, so this is a deliberate
          # miss; restore-keys is what pulls the newest img-main-<board>- entry
          # saved by whichever past run last built this board.
          key: img-main-${{ matrix.board }}-none
          restore-keys: |
            img-main-${{ matrix.board }}-

      - name: Republish carried-forward image for ${{ matrix.board }}
        if: steps.built.outputs.built == 'false' && hashFiles('carry/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: openhc-${{ matrix.board }}
          path: carry/*
          retention-days: 14
          if-no-files-found: error

  # The one check branch protection requires from this workflow. A required
  # check must ALWAYS report: a workflow that never starts (path filter) would
  # leave it pending forever, and a matrix job's check name changes with its
  # matrix. Passes when the work passed or was skipped as irrelevant.
  ok:
    name: images-ok
    needs: [select, build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Everything needed passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
