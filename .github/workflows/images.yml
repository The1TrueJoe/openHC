# openHC board images: select the boards a change affects, build the shared EA
# toolchain once, build each board, keep main's output trees on the ci-cache
# release, carry main's unchanged boards forward, publish the dev channel and
# attach bundles to a release. ci-retry.yml re-runs builds that ran out of time.
name: images

# Runs only for its own paths. ci-ok.yml turns the result into the required
# ci-ok status.
on:
  pull_request:
    paths:
      - 'board/**'
      - 'packages/**'
      - 'build/**'
      - 'Makefile'
      - '.github/workflows/images.yml'
      - '.github/workflows/dsp-program.yml'
  push:
    branches: [main]
    paths:
      - 'board/**'
      - 'packages/**'
      - 'build/**'
      - 'Makefile'
      # main only: a PR's daemons build covers it (see `select`).
      - 'flasher/crates/core/**'
      - '.github/workflows/images.yml'
      - '.github/workflows/dsp-program.yml'
  workflow_dispatch:
    inputs:
      board:
        description: "Single board to build (blank = all)"
        required: false
        default: ""
  # Publishing a release rebuilds and attaches the images.
  release:
    types: [published]
  schedule:
    # Weekly full image matrix: catches upstream breakage on a week nobody
    # touched a board. Monday 04:00 UTC.
    - cron: "0 4 * * 1"

# On a branch, a second push supersedes the first; no value finishing a run for a
# commit that is already history. NOT on main: main's image builds are what save
# the output trees every later build resumes from, a cancelled run saves nothing,
# and main used to merge faster than an HC-800 build finishes, so 23 of 30 main
# runs were cancelled and its tree never got past Node.js. There a new push
# queues behind the running build instead (GitHub keeps only the newest one
# pending). event_name is in the group so a release run (its own tag ref + event)
# is never cancelled by branch pushes.
concurrency:
  group: images-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      boards: ${{ steps.pick.outputs.boards }}
      all: ${{ steps.pick.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax (board.env, init scripts, helpers)
        run: bash build/check-shell.sh

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SELECT_BOARD: ${{ github.event.inputs.board }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash build/select-boards.sh "$BASE" >> "$GITHUB_OUTPUT"

  # Build the EA family's cross toolchain ONCE and hand it to the five EA image
  # jobs, instead of each of them compiling the identical host-gcc from cold.
  # Every EA board is the same target (x86_64 Bonnell, glibc, C++/wchar — see
  # board/ea/common/common_defconfig), so the ~15-min toolchain is bit-for-bit
  # shared. The image jobs below consume it as an external toolchain (see the
  # "Fetch the shared EA toolchain" step and build/build.sh's OHC_EA_SDK path).
  #
  # Only runs when this change actually builds an EA board. The test is a
  # substring match on the selected-board JSON: every EA name contains "ea" and
  # none of ioxv1/ca1/hc800 does, so it is exactly "any EA board selected".

  images-toolchain:
    needs: select
    if: needs.select.outputs.boards != '[]' && contains(needs.select.outputs.boards, 'ea')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `make toolchain` is a fraction of a full image; cap well under the build's.
    timeout-minutes: 120
    steps:
      # sgx545-ce is a submodule and board/Config.in sources its Config.in
      # unconditionally, so `make defconfig` fails without it — same as `build`.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Buildroot pin, for the cache keys below and the fetch.
      - name: Buildroot ref
        run: echo "BUILDROOT_REF=$(tr -d '[:space:]' < build/buildroot.ref)" >> "$GITHUB_ENV"

      # No node/daemon staging here: `make toolchain` never touches the overlay.
      - name: Install build dependencies
        run: bash build/deps.sh

      # Restore only: the image jobs' save (main only) is the one that writes it.
      - name: Restore Buildroot downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ env.BUILDROOT_REF }}-${{ hashFiles('board/**/*_defconfig', 'packages/**/*.mk', 'packages/**/*.hash') }}
          restore-keys: |
            dl-${{ env.BUILDROOT_REF }}-

      # Reuse a toolchain already built for this exact config across runs. Keyed
      # on everything that defines the EA toolchain — the Buildroot ref, both
      # common defconfigs, the Buildroot patch set, and build.sh itself (it
      # composes the defconfig). A hit means the tarball is already on
      # disk and the build below is skipped; a miss builds it from cold. On a hit
      # the artifact upload still runs, so the image jobs always get their SDK.
      - name: Restore cached EA SDK
        id: sdkcache
        uses: actions/cache/restore@v4
        with:
          path: ea-sdk.tar
          key: ea-sdk-${{ env.BUILDROOT_REF }}-${{ hashFiles('board/ea/common/common_defconfig', 'board/common/common_defconfig', 'build/buildroot-patches/**', 'build/build.sh') }}

      - name: Fetch Buildroot
        if: steps.sdkcache.outputs.cache-hit != 'true'
        run: bash build/fetch-buildroot.sh "$HOME/buildroot"

      # Build only the cross toolchain, at a FIXED absolute path. The image jobs
      # extract the tarball back to this SAME path, so the sysroot path baked
      # into the compiler stays valid and no SDK relocation is needed ($GITHUB_
      # WORKSPACE is identical across GitHub-hosted jobs). BOARD is any EA board:
      # the toolchain config lives entirely in the shared common defconfigs, so
      # all five resolve to the same toolchain.
      - name: Build the EA toolchain (once)
        if: steps.sdkcache.outputs.cache-hit != 'true'
        env:
          BOARD: ea3-v2
          OHC_TOOLCHAIN_ONLY: "1"
        run: |
          set -e
          BUILDROOT_DIR="$HOME/buildroot" BOARD=ea3-v2 OHC_TOOLCHAIN_ONLY=1 \
            BR2_OUTPUT_DIR="$GITHUB_WORKSPACE/output/ea-toolchain" \
            bash ./build/build.sh toolchain
          tar -C "$GITHUB_WORKSPACE/output/ea-toolchain" -cf ea-sdk.tar host
          test -x "$GITHUB_WORKSPACE/output/ea-toolchain/host/bin/x86_64-buildroot-linux-gnu-gcc"
          ls -l ea-sdk.tar

      - name: Save cached EA SDK
        if: steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ea-sdk.tar
          key: ea-sdk-${{ env.BUILDROOT_REF }}-${{ hashFiles('board/ea/common/common_defconfig', 'board/common/common_defconfig', 'build/buildroot-patches/**', 'build/build.sh') }}

      # Reliable same-run handoff to the image jobs (they `needs: toolchain` and
      # download this). Short retention — it is scratch, rebuilt whenever needed.
      - name: Upload the EA SDK for the image jobs
        uses: actions/upload-artifact@v4
        with:
          name: ea-sdk
          path: ea-sdk.tar
          retention-days: 3
          if-no-files-found: error


  # openHC's own ADAU1451 program for the EA3 images, built from its design
  # (board/ea/common/firmware/dsp/adau1451/program.json) by SigmaStudio+ on a
  # Windows runner, alongside the EA toolchain. It is ADI-generated code, which
  # may go only into the product it programs: dsp-program.yml hands it over
  # SEALED (readable only with this repo's secrets) and kept a day, and the EA3
  # image jobs open it and build it into the image. Nowhere else.
  # Without the SigmaStudio+ secrets (a fork) it reports program=false and the
  # EA3 images build without it, as before there was one.
  dsp:
    needs: select
    if: contains(needs.select.outputs.boards, 'ea3')
    permissions:
      contents: read
    uses: ./.github/workflows/dsp-program.yml
    secrets: inherit

  images-build:
    needs: [select, images-toolchain, dsp]
    # !cancelled(), so a run that selected only non-EA boards (toolchain
    # skipped) still builds them, and a toolchain failure fails only the EA
    # image jobs (at their download step), not ioxv1/ca1/hc800. NOT always():
    # GitHub never cancels an always() job, so a superseded branch run kept its
    # image jobs going for hours and held the newer run pending behind it in
    # the concurrency group. select must have succeeded and picked at least
    # one board.
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.boards != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # Buildroot from cold is long; the hard ceiling is 6 h and a job killed at
    # the limit leaves no artifact and no useful log tail.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.select.outputs.boards) }}
    steps:
      # A warm tree is ~12 GB unpacked on top of dl/ and ccache, which leaves no
      # margin on a hosted runner (ea5 ran out restoring its tree). Drop the
      # preinstalled toolchains no board build uses.
      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /opt/microsoft /opt/google /usr/lib/jvm
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      # sgx545-ce is a submodule and board/Config.in sources its Config.in
      # unconditionally, so defconfig fails for every board without it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Buildroot pin, for the cache keys below and the fetch.
      - name: Buildroot ref
        run: echo "BUILDROOT_REF=$(tr -d '[:space:]' < build/buildroot.ref)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: packages/webd/ui/package-lock.json

      # The daemons are cross-compiled and STAGED INTO THE ROOTFS OVERLAY before
      # Buildroot runs, because that is where packages/build.sh puts them and
      # where the image picks them up. Without this the overlay directory is
      # empty and every image ships with no iod and no webd — the init scripts
      # report "not installed" and the box boots with no IO server and no GUI.
      # That was true of every image built before this step existed.
      - name: Stage the openHC daemons into the rootfs overlay
        run: bash build/stage-daemons.sh "${{ matrix.board }}"

      # The HC-800 also builds the static i686 kexec (below).
      - name: Install build dependencies
        run: bash build/deps.sh ${{ matrix.board == 'hc800' && '--kexec' || '' }}

      # The one genuinely shared artefact. Keyed on the board files that pin
      # versions, NOT on the board, so all eight matrix jobs hit the same entry.
      # restore-keys means a version bump reuses the previous download set and
      # fetches only what actually moved. Restore here, save (main only) after
      # the build: a PR that bumps a package would otherwise park its own
      # 1.3 GB dl/ that no other branch can read.
      - name: Restore Buildroot downloads
        id: dlcache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ env.BUILDROOT_REF }}-${{ hashFiles('board/**/*_defconfig', 'packages/**/*.mk', 'packages/**/*.hash') }}
          restore-keys: |
            dl-${{ env.BUILDROOT_REF }}-

      # The expensive thing is the CROSS TOOLCHAIN, and it is identical on every
      # run: host-gcc-initial and host-gcc-final are ~15 of the ~33 minutes, and
      # nothing in this repo changes their config from one commit to the next.
      # Caching dl/ above only saves the download, not a single compiled object.
      #
      # Safe to reuse because build/build.sh already defends the two ways an
      # incremental Buildroot tree goes wrong:
      #   * it WIPES $OUT when the resolved toolchain config changes, and again
      #     when the on-disk compiler cannot do what .config claims;
      #   * it runs `linux-dirclean` every time, so the kernel is always
      #     re-extracted, re-patched and re-injected with our drivers — an
      #     edit to board/*/kernel never rides on a stale stamp.
      #
      # Saved when the build fails too, because a failed build is exactly when
      # the toolchain is most worth keeping. A typo in a driver should cost one
      # kernel rebuild, not another 15 minutes of gcc.
      # CACHE EPOCH — bump this when a PACKAGE's config changes in a way
      # Buildroot's per-package stamps do not notice (a cached package is not
      # rebuilt just because the defconfig that selects its options changed). The
      # kernel is safe (linux-dirclean runs every build), but packages are not:
      # r2 forced one clean rebuild after round 2 added dbus, so avahi rebuilt
      # with libavahi-client (shairport-sync needs it) instead of riding the
      # pre-round-2 dbus-less avahi in the cache. r3 went with the move to
      # Buildroot 2026.02.3 (the ref is in the key too, so this is belt and braces).
      #
      # The tree lives on the `ci-cache` pre-release, not in the Actions cache
      # (.github/scripts/release-cache.sh): eight boards' trees, the HC-800's with
      # WebKit, LLVM and Node in it, do not fit the 10 GB cap, and the evicted
      # HC-800 tree is why every PR compiled Node and WebKit cold. Main's newest
      # tree, whether that build passed or ran out of time, is what every run
      # starts from.
      # EA is r4: those boards carry an EXTERNAL toolchain, so an r3 tree (its
      # own internal glibc gcc) must never be restored into one. build.sh would
      # wipe it anyway (BR2_TOOLCHAIN_EXTERNAL is in its toolchain-change
      # detector), but a clean name is belt and braces.
      - name: Restore Buildroot output tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-cache.sh restore out-${{ matrix.board }}-${{ env.BUILDROOT_REF }}-${{ startsWith(matrix.board, 'ea') && 'r4' || 'r3' }} output/build/${{ matrix.board }}

      # ccache, for the boards that build WebKit: the EA family shares ONE,
      # keyed on the family rather than the board, so a translation unit
      # compiled for ea1-v2 (WebKit, ICU, the toolchain's own host-gcc) is a hit
      # for every other EA board and every later run; the HC-800 has its own
      # (x86_64 musl, nothing to share). The key carries run_id AND run_attempt,
      # because a cache key is write-once and re-attempts of one run share
      # run_id — so a run_id-only key would let attempt 3 restore only attempt
      # 1's objects, never attempt 2's. The restore-keys walk back: THIS run's
      # previous attempt first (the run_id- prefix), then this board's newest
      # from older runs, then any of its family's. restore/save split (not plain
      # actions/cache) so a FAILED build still saves what it compiled — the save
      # runs on failure() — and the next attempt resumes from it.
      #
      # This is what lets a PR finish a cold WebKit at all: PRs do not save the
      # output tree (below), so a build that runs out of time keeps nothing but
      # this ccache.
      #
      # Only a PR's own failed attempts are in the Actions cache; main's ccache is
      # on the ci-cache release beside its tree, and the next step takes that when
      # nothing here matched.
      - name: Restore ccache
        id: ccache
        if: startsWith(matrix.board, 'ea') || matrix.board == 'hc800'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ startsWith(matrix.board, 'ea') && 'ea' || matrix.board }}-${{ env.BUILDROOT_REF }}-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ startsWith(matrix.board, 'ea') && 'ea' || matrix.board }}-${{ env.BUILDROOT_REF }}-${{ matrix.board }}-${{ github.run_id }}-
            ccache-${{ startsWith(matrix.board, 'ea') && 'ea' || matrix.board }}-${{ env.BUILDROOT_REF }}-${{ matrix.board }}-
            ccache-${{ startsWith(matrix.board, 'ea') && 'ea' || matrix.board }}-${{ env.BUILDROOT_REF }}-
      - name: Restore ccache (main's, from the ci-cache release)
        if: (startsWith(matrix.board, 'ea') || matrix.board == 'hc800') && steps.ccache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-cache.sh restore ccache-${{ matrix.board }}-${{ env.BUILDROOT_REF }} .ccache

      - name: Fetch Buildroot
        run: bash build/fetch-buildroot.sh "$HOME/buildroot"

      # The version string CI stamps into the image and reuses as the bundle
      # name: the release tag on a release, else <short-sha>-dev. post-build.sh
      # reads OHC_VERSION and writes it into /etc/openhc-release so the flasher
      # can compare an installed box against the latest release.
      - name: Compute version
        id: ver
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          v=$(bash build/version.sh "$TAG")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "openHC version: $v"

      # EA boards consume the toolchain the `toolchain` job built, instead of
      # building their own. download-artifact errors if ea-sdk is missing (a
      # failed toolchain job), which correctly fails this EA image job while
      # leaving non-EA jobs alone. Extract to the SAME absolute path the
      # toolchain was built at so its baked-in sysroot path stays valid. The
      # tarball itself lands in runner.temp, outside the checkout, so nothing in
      # an artifact can overwrite a checked-out file (CodeQL artifact poisoning).
      - name: Fetch the shared EA toolchain
        if: startsWith(matrix.board, 'ea')
        uses: actions/download-artifact@v4
        with:
          name: ea-sdk
          path: ${{ runner.temp }}/ea-sdk
      - name: Unpack the EA toolchain to its fixed path
        if: startsWith(matrix.board, 'ea')
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/output/ea-toolchain"
          tar -C "$GITHUB_WORKSPACE/output/ea-toolchain" -xf "$RUNNER_TEMP/ea-sdk/ea-sdk.tar"
          test -x "$GITHUB_WORKSPACE/output/ea-toolchain/host/bin/x86_64-buildroot-linux-gnu-gcc"

      # Bake the on-panel WPE/SGX sysroot into EA images. These are i386 trees (the
      # only SGX545 DDK is 32-bit) built by sgx-wpe.yml / sgx-gpu.yml and harvested
      # as tarballs — Buildroot cannot multilib an i386 WebKit into this x86_64
      # image, so post-build.sh extracts them into /opt. Absent (no successful build
      # yet, or the 14-day artifact expired) => the image ships WITHOUT the on-panel
      # browser, a clean no-op (S95ohc-display then stays off), so this never fails
      # the build. Non-EA boards skip it entirely.
      - name: Fetch the on-panel WPE/SGX sysroot (EA)
        id: sgxsr
        if: startsWith(matrix.board, 'ea')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grab() {  # $1=workflow  $2=artifact  $3=GITHUB_OUTPUT var
            run=$(gh run list --workflow="$1" --branch "${{ github.ref_name }}" \
                    --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
            [ -n "$run" ] || { echo ">> no successful $1 run — $2 will be absent"; return 0; }
            d="$RUNNER_TEMP/sgxsr/$2"; rm -rf "$d"; mkdir -p "$d"
            gh run download "$run" -n "$2" -D "$d" 2>/dev/null \
              || { echo ">> $2 artifact gone from run $run (expired?) — absent"; return 0; }
            f=$(find "$d" -name '*.tar.gz' | head -1)
            [ -n "$f" ] && { echo "$3=$f" >> "$GITHUB_OUTPUT"; echo ">> $2 -> $f ($(du -h "$f" | cut -f1))"; }
          }
          grab sgx-wpe.yml wpe-i386-sysroot wpe
          grab sgx-gpu.yml sgx-i386-sysroot i386

      # The EA3's DSP program from the `dsp` job: opened here, built into the
      # image's DSP firmware, and nowhere else. A design that failed fails the
      # EA3 images rather than shipping them silently without it.
      - name: Fetch the DSP program (EA3)
        if: startsWith(matrix.board, 'ea3') && needs.dsp.result == 'failure'
        run: |
          echo "::error::the dsp job failed: no DSP program for ${{ matrix.board }}"
          exit 1
      - name: Download the sealed DSP program (EA3)
        if: startsWith(matrix.board, 'ea3') && needs.dsp.outputs.program == 'true'
        uses: actions/download-artifact@v4
        with:
          name: adau1451-program-sealed
          path: ${{ runner.temp }}/dsp-sealed
      - name: Open the DSP program (EA3)
        id: dsp
        if: startsWith(matrix.board, 'ea3') && needs.dsp.outputs.program == 'true'
        env:
          KEY: ${{ secrets.SIGMASTUDIO_TOKEN }}
        run: |
          set -euo pipefail
          d="$HOME/adau1451-program"
          rm -rf "$d"; mkdir -p "$d"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:KEY \
            -in "$RUNNER_TEMP/dsp-sealed/adau1451-program.tar.enc" | tar -C "$d" -xf -
          rm -rf "$RUNNER_TEMP/dsp-sealed"
          ls -l "$d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.board }}
        env:
          BUILDROOT_DIR: ${{ github.workspace }}/../buildroot
          BOARD: ${{ matrix.board }}
          OHC_VERSION: ${{ steps.ver.outputs.version }}
          # Consumed by board/common/post-build.sh (empty on non-EA / when absent).
          OHC_SGX_WPE_SYSROOT: ${{ steps.sgxsr.outputs.wpe }}
          OHC_SGX_I386_SYSROOT: ${{ steps.sgxsr.outputs.i386 }}
          # The EA3's DSP program folder (empty: none); build.sh sets
          # BR2_PACKAGE_ADAU1451_FW_PROGRAM from it.
          OHC_DSP_PROGRAM: ${{ steps.dsp.outputs.dir }}
          # The ccache dir (see the restore/save steps; BR2_CCACHE in
          # board/ea/common/common_defconfig and board/hc800/hc800_defconfig).
          # build.sh forwards it to make only when set; a board whose defconfig
          # has no BR2_CCACHE ignores it.
          BR2_CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -e
          # build.sh caps parallelism by RAM; the runner has 4 cores / 16 GB.
          # OHC_VERSION is exported here so Buildroot's post-build hook stamps it;
          # OHC_SGX_*_SYSROOT (step env above) reach post-build the same way.
          # EA boards point build.sh at the pre-built toolchain; it then composes
          # the external-toolchain defconfig instead of the internal glibc one.
          case "${{ matrix.board }}" in
            ea*) export OHC_EA_SDK="$GITHUB_WORKSPACE/output/ea-toolchain/host" ;;
          esac
          #
          # Its own deadline, 20 minutes inside the job's 350: a build that
          # runs out of time must FAIL, not be cancelled — a failed build's
          # tree is cached and the next run resumes from it, a cancelled one is
          # not (see "Save Buildroot output tree"), so a first build longer than
          # one job (LLVM + WebKit from scratch) would otherwise restart from
          # zero every time. SIGINT lets make remove the half-built target.
          # Running out of time is marked with a `build-timeout` annotation: that
          # is what ci-retry.yml looks for before it re-runs the job.
          rc=0
          BUILDROOT_DIR="$HOME/buildroot" BOARD="${{ matrix.board }}" \
            OHC_VERSION="${{ steps.ver.outputs.version }}" \
            timeout --signal=INT --kill-after=2m 325m bash ./build/build.sh || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error title=build-timeout::${{ matrix.board }} ran out of its 325 minutes; what it built is saved, a re-run resumes from it"
          fi
          exit "$rc"

      # The HC-800's first install starts openHC from the RUNNING Control4 image
      # with kexec (writes nothing). Control4 never shipped the userspace tool,
      # and the vendor userland is 32-bit glibc, so the bundle carries a static
      # i686 kexec the flasher pushes when the box has none. tools.yml runs the
      # same script; built here so every hc800 release is self-sufficient
      # instead of depending on a separate artifact that expires.
      - name: Static i686 kexec (HC-800 stock-side launch)
        if: success() && matrix.board == 'hc800'
        run: bash build/kexec-i686.sh "output/build/${{ matrix.board }}/images/kexec-i686-static"

      # One zip the flasher reads directly: openhc-<board>-<version>.zip.
      - name: Bundle images
        if: success()
        id: bundle
        run: |
          b=$(bash build/bundle.sh "${{ matrix.board }}" "${{ steps.ver.outputs.version }}")
          echo "bundle=$b" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          # Per-OS-unique artifact name (v4 requires it); the zip inside carries
          # the versioned bundle name.
          name: openhc-${{ matrix.board }}
          path: ${{ steps.bundle.outputs.bundle }}
          retention-days: 14
          if-no-files-found: error

      # Carry-forward store (main only). A newer push to main replaces a run
      # still queued behind a build (see `concurrency`), and `select` then
      # rebuilds only the boards THIS push changed — so without this, the boards
      # an earlier run had built would vanish from the newest run's output. Each successful main
      # build parks its bundle in a per-board cache under a stable `carry/` dir;
      # the `carry-forward` job below republishes it for any board the newest run
      # did not rebuild, so main always has a complete, current image set.
      - name: Persist this board's image for carry-forward (main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p carry
          cp "${{ steps.bundle.outputs.bundle }}" carry/
      - name: Save carry-forward image (main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: carry
          key: img-main-${{ matrix.board }}-${{ github.run_id }}

      # Drop only what is genuinely rebuilt. That is a shorter list than it
      # looks:
      #
      #   build/linux-*  yes — build.sh runs linux-dirclean every time, so the
      #                  kernel is re-extracted, re-patched and re-injected with
      #                  our drivers on every build regardless.
      #   images/        yes — pure output, and already uploaded above.
      #   target/        NO. This looked regenerable and is not: packages
      #                  install INTO it, and their stamps say "installed", so a
      #                  restored tree without it never refills it and the build
      #                  dies at target-finalize with
      #                  "sed: can't read .../target/etc/hosts".
      #   staging/       NO, for the same reason.
      # Not when cancelled: a cancel kills Buildroot mid-write, and that tree is
      # poison to the next run (a half-linked host libcrypto broke every board
      # that restored one). A FAILED build is still saved — its broken package
      # has no stamp, so Buildroot redoes it — and keeps everything before it.
      - name: Trim the output tree before caching
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          O=output/build/${{ matrix.board }}
          [ -d "$O" ] || exit 0
          rm -rf "$O"/build/linux-* "$O"/images
          echo ">> cacheable tree: $(du -sh "$O" 2>/dev/null | cut -f1)"

      - name: Save Buildroot downloads (main)
        if: ${{ !cancelled() && steps.dlcache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ env.BUILDROOT_REF }}-${{ hashFiles('board/**/*_defconfig', 'packages/**/*.mk', 'packages/**/*.hash') }}

      # main only, to the ci-cache release (see the restore step). A PR run
      # restores main's tree but never saves: a PR's tree is its own change on
      # top of main's, and one writer means no two runs ever race on an entry
      # (main's runs queue, see `concurrency`). Saved when the build ran out of
      # time too: the re-run (ci-retry.yml) resumes from it. Release and
      # scheduled runs do not save.
      - name: Save Buildroot output tree
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-cache.sh save out-${{ matrix.board }}-${{ env.BUILDROOT_REF }}-${{ startsWith(matrix.board, 'ea') && 'r4' || 'r3' }} output/build/${{ matrix.board }}

      # main saves the ccache on every run, to the ci-cache release beside its
      # tree. A PR saves it, to the Actions cache, only when the build FAILED:
      # then the objects it compiled are what lets the re-attempt finish, and a
      # typo deep in WebKit should not cost that work. A PR whose build passed
      # has nothing to re-attempt. Whatever a PR saves is deleted when it closes
      # (cache-cleanup.yml). ccache caps itself (--max-size in the board's
      # defconfig).
      - name: Save ccache (main, to the ci-cache release)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (startsWith(matrix.board, 'ea') || matrix.board == 'hc800') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-cache.sh save ccache-${{ matrix.board }}-${{ env.BUILDROOT_REF }} .ccache
      - name: Save ccache (a PR's failed attempt)
        if: failure() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (startsWith(matrix.board, 'ea') || matrix.board == 'hc800')
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ startsWith(matrix.board, 'ea') && 'ea' || matrix.board }}-${{ env.BUILDROOT_REF }}-${{ matrix.board }}-${{ github.run_id }}-${{ github.run_attempt }}

      # On a release, attach the bundle so the flasher can pull the latest image
      # for a board straight from the release.
      - name: Attach to release
        if: success() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.bundle.outputs.bundle }}" --clobber

      # A build that fails deep in a package leaves the reason in Buildroot's
      # log, not in the step output, and without this you re-run the whole
      # thing blind just to read it.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.board }}
          path: |
            output/build/*/build/*/config.log
            output/build/${{ matrix.board }}/*.log
          retention-days: 7
          if-no-files-found: ignore

  # The rolling `dev` pre-release: the dev update channel (ohc-update on the
  # box; stable is a published release, which `Attach to release` fills). CI
  # artifacts need a GitHub token to download; release assets do not, so a box
  # can fetch these directly. A push rebuilds only the boards it touches, so
  # each board's zip is replaced on its own and the others stay — the zip names
  # carry their own versions (openhc-<board>-<sha>-dev.zip). The `dev` tag
  # follows the newest commit that published.
  images-dev-release:
    name: dev release
    needs: [select, images-build]
    # Whatever built: one board failing must not hold back the others' images
    # (only successful boards upload an artifact).
    if: >-
      !cancelled() && needs.select.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openhc-*
          path: bundles
          merge-multiple: true
      - name: Publish to the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A push that rebuilt no board (select picked nothing, or every build
          # failed) uploads no openhc-* artifact, so there is nothing to publish
          # and the dev release keeps the images it has.
          if ! ls bundles/openhc-*.zip >/dev/null 2>&1; then
            echo "no images built in this run — dev release unchanged"
            exit 0
          fi
          ls -l bundles
          # The tag first (create, or move it here), then the release on it.
          if gh api "repos/$GH_REPO/git/refs/tags/dev" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Rolling development builds of main — the dev update channel. Each board's image is replaced when a commit that affects it builds, so the zips can come from different commits; the version is in each name (openhc-<board>-<sha>-dev.zip). Not a release: for that, use the latest published one."
          gh release view dev >/dev/null 2>&1 || \
            gh release create dev --prerelease --title "dev (rolling)" --notes "$notes"
          existing=$(gh release view dev --json assets -q '.assets[].name')
          for z in bundles/openhc-*.zip; do
            n=$(basename "$z")
            # openhc-<board>-<version>.zip: the board is everything before the
            # version, which starts with the 7-hex short sha.
            board=$(echo "$n" | sed -E 's/^openhc-(.*)-[0-9a-f]{7,}-dev\.zip$/\1/')
            for old in $(echo "$existing" | grep -E "^openhc-${board}-[0-9a-f]{7,}-dev\.zip$" || true); do
              [ "$old" = "$n" ] || gh release delete-asset dev "$old" --yes
            done
            gh release upload dev "$z" --clobber
            echo "dev: $n"
          done


  # Republish the latest image for every board the newest main run did NOT
  # rebuild, pulled from the per-board carry-forward cache the build job fills.
  # This is what lets a newer push to main replace a queued run (see
  # `concurrency`) without the boards earlier runs had built dropping out:
  # main ends every run with a complete, current image set.
  #
  # Best-effort: a cold cache (no prior image for a board yet) just means
  # nothing to carry. Main only, so never part of a PR's ci-ok.

  images-carry-forward:
    needs: [select, images-build]
    # !cancelled(), not always(): runs after a failed build, stops with a cancel.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.select.outputs.all) }}
    steps:
      # A board this run built already uploaded openhc-<board>; re-uploading the
      # same artifact name would collide, so carry forward only the rest.
      - name: Did this run build ${{ matrix.board }}?
        id: built
        run: echo "built=${{ contains(fromJSON(needs.select.outputs.boards), matrix.board) }}" >> "$GITHUB_OUTPUT"

      - name: Restore last main image for ${{ matrix.board }}
        if: steps.built.outputs.built == 'false'
        uses: actions/cache/restore@v4
        with:
          path: carry
          # No per-run key can match an earlier run, so this is a deliberate
          # miss; restore-keys is what pulls the newest img-main-<board>- entry
          # saved by whichever past run last built this board.
          key: img-main-${{ matrix.board }}-none
          restore-keys: |
            img-main-${{ matrix.board }}-

      - name: Republish carried-forward image for ${{ matrix.board }}
        if: steps.built.outputs.built == 'false' && hashFiles('carry/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: openhc-${{ matrix.board }}
          path: carry/*
          retention-days: 14
          if-no-files-found: error
