# Build the openHC documentation site and publish it to GitHub Pages.
#
# The site lives in site/ (Astro + Starlight) and is entirely static. It is
# built with `base: '/openHC'` for a project Pages site at
# https://the1truejoe.github.io/openHC/ — if this repo is ever renamed or moved
# to a user/org site, that `base` in site/astro.config.mjs must change with it,
# or every internal link 404s in production while working fine locally.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
    # Only rebuild when something that can change the output changes. The site
    # is self-contained, so nothing under board/ or flasher/ affects it.
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
  pull_request:
  workflow_dispatch:

# Pages needs id-token for the deploy, and pages: write to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# A second push supersedes the first, but never cancel a deploy that is already
# uploading — a half-published site is worse than a stale one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests are not path-filtered at the trigger (so `docs-ok` always
  # reports), so the filter lives here; push (filtered above), release and
  # manual runs always build.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - 'site/**'
              - '.github/workflows/docs.yml'

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is committed, and a
      # docs build should never silently pick up a different Starlight.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Only the default branch publishes. On a pull request the build above is
      # the whole point — it catches a broken link or a bad frontmatter schema
      # before it reaches main.
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The one check branch protection requires from this workflow. A required
  # check must ALWAYS report: a workflow that never starts (path filter) would
  # leave it pending forever, and a matrix job's check name changes with its
  # matrix. Passes when the work passed or was skipped as irrelevant.
  ok:
    name: docs-ok
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything needed passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
