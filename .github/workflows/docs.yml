# The docs site (site/): build on every change, deploy to Pages from main.
# Independent of the images.
name: docs

# Runs only for its own paths. ci-ok.yml turns the result into the required
# ci-ok status.
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# A newer push to a branch supersedes the run; main queues instead.
concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is committed, and a
      # docs build should never silently pick up a different Starlight.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Only the default branch publishes. On a pull request the build above is
      # the whole point — it catches a broken link or a bad frontmatter schema
      # before it reaches main.
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  docs-deploy:
    needs: docs-build
    # Only a main build deploys, never a PR's.
    if: needs.docs-build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
