# Build openHC's own ADAU1451 program (the EA3's DSP) with SigmaStudio+.
#
# There is no open toolchain for the ADAU145x — its instruction set is not
# public — so the program is built by Analog Devices' SigmaStudio+, driven from
# a script rather than its GUI, through The1TrueJoe/sigmastudio-plus-action:
# a silent install on a Windows runner and SigmaStudio+'s headless console app
# (SStudioPlusConsole.exe: createproject, update*, lcd, export).
#
# THE INSTALLER IS NOT IN THIS REPO AND IS NOT DOWNLOADED FROM ANALOG DEVICES
# HERE. Its download needs a myAnalog sign-in and acceptance of ADI's software
# license, which only a person can give. The repo owner downloaded it once and
# staged it in a private repo; this workflow fetches that copy with two secrets:
#
#   SIGMASTUDIO_INSTALLER_URL  the release-asset API URL in the private repo
#   SIGMASTUDIO_TOKEN          a fine-grained token, Contents: read on that repo
#
# With either secret missing the job says so and stops, green.
#
# Stage 1 (this file today) proves the toolchain: install, the console app
# headless, ADAU145x support. Stage 2 adds the design script and the export,
# handed to the EA image build as an artifact — the exported program never
# enters git (ADI's license restricts distributing generated code outside the
# products it runs on).
name: dsp-program

permissions:
  contents: read

on:
  workflow_dispatch:
  # workflow_dispatch only registers from the default branch, so until this lands
  # on main, a path-filtered push trigger is how it runs on a feature branch.
  push:
    paths:
      - .github/workflows/dsp-program.yml

jobs:
  toolchain:
    runs-on: windows-latest
    steps:
      - name: Staged installer?
        id: staged
        shell: pwsh
        env:
          INSTALLER_URL: ${{ secrets.SIGMASTUDIO_INSTALLER_URL }}
          TOKEN: ${{ secrets.SIGMASTUDIO_TOKEN }}
        run: |
          if (-not $env:INSTALLER_URL -or -not $env:TOKEN) {
            "::notice::SigmaStudio+ is not staged (SIGMASTUDIO_INSTALLER_URL / SIGMASTUDIO_TOKEN unset) - nothing to do"
            "ok=false" >> $env:GITHUB_OUTPUT
          } else {
            "ok=true" >> $env:GITHUB_OUTPUT
          }

      - name: SigmaStudio+
        if: steps.staged.outputs.ok == 'true'
        uses: The1TrueJoe/sigmastudio-plus-action@v1
        with:
          installer-url: ${{ secrets.SIGMASTUDIO_INSTALLER_URL }}
          token: ${{ secrets.SIGMASTUDIO_TOKEN }}
          # SigmaStudio+ 3.4.0, as staged in the private repo.
          installer-sha256: 47814f9691d6a0f334b341caa6a49db2a03f6549b62db3cc82530845c1268640
          run: |
            New-Item -ItemType Directory -Force logs | Out-Null
            & $env:SSPLUS_CONSOLE --help *>&1 | Tee-Object logs/console.txt
            if ($LASTEXITCODE) { "::error::console app exit $LASTEXITCODE"; exit 1 }
            # Where SigmaStudio+ keeps its per-processor support is not documented,
            # so record the install tree and every name that mentions the family
            # before asserting anything about it.
            Get-ChildItem -Path $env:SSPLUS_HOME -Directory -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName | Out-File logs/tree.txt
            Get-ChildItem -Path $env:SSPLUS_HOME -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '145[0-2]|146[0-7]|ADAU|Sigma ?3[05]0|SigmaDSP' } |
              Select-Object -First 200 -ExpandProperty FullName | Tee-Object logs/adau145x.txt
            if (-not (Get-Content logs/adau145x.txt -ErrorAction SilentlyContinue)) {
              "::warning::nothing named for ADAU145x/146x under $env:SSPLUS_HOME; see logs/tree.txt"
            }
            # Processor support may be DLLs beside the host, or downloadable add-ins
            # kept outside the install folder.
            Get-ChildItem -Path "$env:SSPLUS_HOME\Host" -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name | Out-File logs/host-files.txt
            Get-ChildItem -Path $env:SSPLUS_HOME, $env:ProgramData, $env:APPDATA, $env:LOCALAPPDATA -Directory -Recurse -Depth 4 -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'SigmaStudio|Analog Devices' -and $_.Name -match 'add-?in|plugin|processor|platform|device' } |
              Select-Object -ExpandProperty FullName | Out-File logs/addin-dirs.txt
            # The host ships NuGet.Core and an UpdateManager, and the install makes
            # ProgramData\Analog Devices\SigmaStudio 3.4\Plugins: processor support
            # looks like NuGet add-ins. Record what is there and where they come from.
            Get-ChildItem -Path "$env:ProgramData\Analog Devices" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 400 | Out-File logs/plugins.txt
            Get-ChildItem -Path "$env:SSPLUS_HOME\Setup" -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 400 | Out-File logs/setup.txt
            Copy-Item "$env:SSPLUS_HOME\Host\*.exe.config" logs/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always() && steps.staged.outputs.ok == 'true'
        with:
          name: sigmastudio-toolchain-logs
          path: logs/
          if-no-files-found: ignore
