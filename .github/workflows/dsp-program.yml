# Build openHC's own ADAU1451 program (the EA3's DSP) with SigmaStudio+.
#
# There is no open toolchain for the ADAU145x — its instruction set is not
# public — so the program is built by Analog Devices' SigmaStudio+, driven from
# a script rather than its GUI, through The1TrueJoe/sigmastudio-plus-action:
# a silent install on a Windows runner and SigmaStudio+'s headless console app
# (SStudioPlusConsole.exe: createproject, update*, lcd, export).
#
# THE INSTALLER IS NOT IN THIS REPO AND IS NOT DOWNLOADED FROM ANALOG DEVICES
# HERE. Its download needs a myAnalog sign-in and acceptance of ADI's software
# license, which only a person can give. The repo owner downloaded it once and
# staged it in a private repo; this workflow fetches that copy with two secrets:
#
#   SIGMASTUDIO_INSTALLER_URL  the release-asset API URL in the private repo
#   SIGMASTUDIO_TOKEN          a fine-grained token, Contents: read on that repo
#
# With either secret missing the job says so and stops, green.
#
# The design is board/ea/common/firmware/dsp/adau1451/program.json: SigmaStudio+
# scripting calls, run in order by the action's headless scripting host
# (ssplus-script.exe). It starts from ADI's ADAU1452 example project, which comes
# with SigmaStudio+, because its PC -> USBi -> DSP host link is the one part of a
# system the scripting API cannot add; the design migrates it to the ADAU1451 and
# replaces its algorithms with openHC's. The export becomes mkfw.py's --program
# input (export2program.py), an artifact for the EA image build. The exported
# program never enters git (ADI's license restricts distributing generated code
# outside the products it runs on).
name: dsp-program

permissions:
  contents: read

on:
  workflow_dispatch:
  # workflow_dispatch only registers from the default branch, so until this lands
  # on main, a path-filtered push trigger is how it runs on a feature branch.
  push:
    paths:
      - .github/workflows/dsp-program.yml
      - board/ea/common/firmware/dsp/adau1451/program.json
      - board/ea/common/firmware/dsp/adau1451/export2program.py

jobs:
  toolchain:
    runs-on: windows-latest
    steps:
      - name: Staged installer?
        id: staged
        shell: pwsh
        env:
          INSTALLER_URL: ${{ secrets.SIGMASTUDIO_INSTALLER_URL }}
          TOKEN: ${{ secrets.SIGMASTUDIO_TOKEN }}
        run: |
          if (-not $env:INSTALLER_URL -or -not $env:TOKEN) {
            "::notice::SigmaStudio+ is not staged (SIGMASTUDIO_INSTALLER_URL / SIGMASTUDIO_TOKEN unset) - nothing to do"
            "ok=false" >> $env:GITHUB_OUTPUT
          } else {
            "ok=true" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v4
        if: steps.staged.outputs.ok == 'true'

      - name: SigmaStudio+
        if: steps.staged.outputs.ok == 'true'
        # script-host branch while the scripting host is proven; back to @v1 once tagged.
        uses: The1TrueJoe/sigmastudio-plus-action@script-host
        with:
          installer-url: ${{ secrets.SIGMASTUDIO_INSTALLER_URL }}
          token: ${{ secrets.SIGMASTUDIO_TOKEN }}
          # SigmaStudio+ 3.4.0, as staged in the private repo.
          installer-sha256: 47814f9691d6a0f334b341caa6a49db2a03f6549b62db3cc82530845c1268640
          script-host: 'true'
          run: |
            New-Item -ItemType Directory -Force logs | Out-Null
            # ADAU145x support is a set of plugins the installer drops in
            # ProgramData (not under the install folder): the family's compiler and
            # the Sigma 300 core the ADAU1451 is built on.
            $plugins = "$env:ProgramData\Analog Devices\SigmaStudio 3.4\Plugins"
            foreach ($dll in 'ADAU145x.dll', 'ADAU145XCompiler.dll', 'Sigma300Core.dll') {
              if (-not (Test-Path "$plugins\$dll")) { "::error::no $dll in $plugins"; exit 1 }
            }
            # The design: SigmaStudio+ scripting calls, run headless.
            $env:DSP_OUT = "$env:GITHUB_WORKSPACE\dsp"
            New-Item -ItemType Directory -Force "$env:DSP_OUT\export" | Out-Null
            # The design starts from ADI's ADAU1452 example: its PC -> USBi -> DSP host
            # link is the one part of a system the scripting API cannot add.
            $tpl = Get-ChildItem "$env:ProgramData\Analog Devices" -Recurse -File -Filter '*ADAU1452 Filtering Compressed Input Signal Example.sspeg' | Select-Object -First 1
            if (-not $tpl) { "::error::no ADAU1452 template under $env:ProgramData\Analog Devices"; exit 1 }
            $env:DSP_TEMPLATE = "$env:RUNNER_TEMP\adau1452-template.ssprj"
            Copy-Item -LiteralPath $tpl.FullName $env:DSP_TEMPLATE
            & $env:SSPLUS_SCRIPT board/ea/common/firmware/dsp/adau1451/program.json logs *>&1 | Tee-Object logs/script.txt
            $rc = $LASTEXITCODE
            Get-ChildItem "$env:DSP_OUT" -Recurse -File | Select-Object FullName, Length |
              Format-Table -AutoSize | Out-String -Width 300 | Tee-Object logs/export-files.txt
            if ($rc) { "::error::the design script failed ($rc)"; exit 1 }
            # mkfw.py's --program input, and the map that names every parameter's address.
            python board/ea/common/firmware/dsp/adau1451/export2program.py "$env:DSP_OUT\export" "$env:DSP_OUT\program.txt" --params "$env:DSP_OUT\params.json"
            if ($LASTEXITCODE) { "::error::export2program.py failed"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always() && steps.staged.outputs.ok == 'true'
        with:
          name: sigmastudio-logs
          path: logs/
          if-no-files-found: ignore

      # The exported program: for the EA image build only, kept briefly.
      - uses: actions/upload-artifact@v4
        if: steps.staged.outputs.ok == 'true'
        with:
          name: adau1451-program
          path: |
            dsp/program.txt
            dsp/params.json
            dsp/openhc-ea3.ssprj
          retention-days: 3
          if-no-files-found: error
