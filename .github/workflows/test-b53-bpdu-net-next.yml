name: test-b53-bpdu-net-next

# TEST ONLY: build the b53 BPDU mirror patch (going to net-next) on net-next
# with W=1, with b53 built in and as modules, and run checkpatch on it.
on:
  push:
    branches: [test-b53-bpdu-net-next]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y flex bison libelf-dev libssl-dev bc
      - name: net-next + the patch
        run: |
          git clone -q --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/netdev/net-next.git "$RUNNER_TEMP/linux"
          cd "$RUNNER_TEMP/linux"
          git log --oneline -1
          git -c user.name=ci -c user.email=ci@localhost am -q "$GITHUB_WORKSPACE"/.github/test-b53/*.patch
          git log --oneline -2
      - name: checkpatch --strict
        working-directory: ${{ runner.temp }}/linux
        run: ./scripts/checkpatch.pl --strict --no-signoff -g HEAD
      - name: x86_64, b53 + SPI/MDIO/MMAP as modules, W=1
        working-directory: ${{ runner.temp }}/linux
        run: |
          set -euo pipefail
          make -s x86_64_defconfig
          scripts/config -e NET_DSA -m B53 -m B53_SPI_DRIVER -m B53_MDIO_DRIVER -m B53_MMAP_DRIVER -m B53_SRAB_DRIVER -e SPI -e OF
          make -s olddefconfig
          grep -E "^CONFIG_B53" .config
          make -j"$(nproc)" W=1 modules_prepare 2>&1 | tail -3
          make -j"$(nproc)" W=1 drivers/net/dsa/b53/ 2>&1 | tee b53.log | tail -5
          ls -la drivers/net/dsa/b53/*.o
          if grep -E "b53_(common|priv)\.[ch].*(warning|error)" b53.log; then exit 1; fi
          echo "b53 built with W=1, no warnings"
      - name: arm64, b53 built in, W=1
        working-directory: ${{ runner.temp }}/linux
        run: |
          set -euo pipefail
          sudo apt-get install -y gcc-aarch64-linux-gnu
          make -s mrproper
          make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config -e NET_DSA -e B53 -e B53_SPI_DRIVER -e B53_MDIO_DRIVER
          make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- W=1 drivers/net/dsa/b53/ 2>&1 | tee b53-arm64.log | tail -5
          if grep -E "b53_(common|priv)\.[ch].*(warning|error)" b53-arm64.log; then exit 1; fi
          echo "arm64 b53 built in, W=1, no warnings"
