[package]
name = "ohc-flash-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

# How the app talks to a box. SSH is via the system `ssh`/`sshpass` for now
# (proven against these boxes' legacy crypto, and OpenSSH ships on macOS, Linux
# and Windows 10+); it sits behind a trait so a pure-Rust client (russh) can be
# dropped in later without touching the engine.
[dependencies]
ohc-flash-core = { workspace = true }
# The EA netboot bring-up drives CEFDK's serial console. `serialport` is the
# cross-platform (macOS/Linux/Windows) way to open a UART; kept behind our own
# `Serial` type so a different backend could replace it like ssh.rs plans for.
# default-features off drops serialport's udev-based port ENUMERATION, which we
# do not use (netboot is given the device path explicitly) — and with it the
# Linux libudev/pkg-config build dependency, so this links on the flasher CI
# Linux runner (which installs xcb/xkb/wayland/ssl but not libudev) with nothing
# extra. Opening a port by path still works on all three platforms. The
# BOOTP responder (bootp.rs, for the EA CEFDK RAM-boot) is plain std::net + threads.
serialport = { version = "4", default-features = false }
# Pure-Rust hashing for the MAC-derived stock root password (authderive.rs).
# No system libraries, so it links on every flasher CI runner unchanged.
sha2 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# The IO-Extender netboot (netboot.rs) speaks full DHCP+TFTP rather than the EA's
# minimal BOOTP cookie, because its bootloader asks for the option extensions.
# The wire formats are not worth owning: dhcproto is a complete DHCPv4 codec and
# tftpd is a TFTP server that already implements the option extensions
# (blocksize, timeout, tsize, windowsize) a bootloader may ask for. What stays
# ours is the policy — one MAC, one file — which is the only part that is
# actually about flashing a Control4 box.
dhcproto = "0.15"
tftpd = "1"
tempfile = "3"
# A DHCP reply goes to the limited broadcast 255.255.255.255, and that address
# tells the routing table nothing about which wire it belongs on. On a host with
# two networks the kernel picks one — on the Mac this was first tested against,
# a cloned host route sent every reply out the wrong interface while `send_to`
# cheerfully returned Ok. socket2 is the only way to say which interface;
# if-addrs is how we turn "the address we are serving as" into its name.
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# if_nametoindex: the Apple binding takes an interface INDEX where Linux takes
# a name, and socket2 does not do the lookup for us.
libc = "0.2"
