[package]
name = "ohc-flash-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

# How the app talks to a box. SSH is via the system `ssh`/`sshpass` for now
# (proven against these boxes' legacy crypto, and OpenSSH ships on macOS, Linux
# and Windows 10+); it sits behind a trait so a pure-Rust client (russh) can be
# dropped in later without touching the engine.
[dependencies]
ohc-flash-core = { workspace = true }
# Netboot. The wire formats are not worth owning: dhcproto is a complete DHCPv4
# codec and tftpd is a TFTP server that already implements the option
# extensions (blocksize, timeout, tsize, windowsize) a bootloader may ask for.
# What stays ours is the policy — one MAC, one file — which is the only part
# that is actually about flashing a Control4 box.
dhcproto = "0.15"
tftpd = "1"
tempfile = "3"

