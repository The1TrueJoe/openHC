# openHC — the controller's MQTT broker (every board).
#
# Clients: iod, sysmond and ohc-audiod on the box (each publishes its own topics
# under <prefix>/<host>/), Home Assistant / Control4 drivers on the LAN, and the
# web UI through webd's /mqtt (which forwards to the WebSocket listener below).
#
# No auth: a LAN appliance with no user accounts, behind whatever the home
# network already is — the same stance iod's API takes. Tighten (password_file /
# TLS) before this faces an untrusted network.
per_listener_settings false
allow_anonymous true

# LAN: integrations.
listener 1883 0.0.0.0

# Loopback WebSocket for the web UI; webd proxies /mqtt here, so browsers never
# need a second port open.
listener 9001 127.0.0.1
protocol websockets

# Retained state lives in RAM: every daemon republishes all of its retained
# topics when it (re)connects, so nothing is lost across a broker restart that
# the daemons will not restore within seconds.
persistence false
log_dest syslog
log_type error
log_type warning
log_type notice

# Bridge to a house broker, written by iod from its MQTT settings (empty when no
# bridge is configured).
include_dir /etc/mosquitto/conf.d
