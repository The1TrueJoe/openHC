# openHC IO server — SITE configuration.
#
# Per-installation, unlike /opt/ohc/board.env which describes the silicon and is
# identical on every unit of a model. Everything here is commented out: a
# controller with this file untouched runs standalone with no broker and no
# authentication, which is what a bench bring-up needs.
#
# Shell assignments only; sourced by /etc/init.d/S89ohcio.

# --- API -------------------------------------------------------------------
# Where the IO API listens. The config GUI on :80 talks to it here.
#IOD_BIND=0.0.0.0:7070

# Shared secret for the REST API and both WebSockets. UNSET = no authentication,
# which is the default because the first thing this has to do is work on a bench
# with a serial cable and no configuration.
#
# Set it on anything reachable from a wider network: without it, everything that
# can route to this box can close a relay. Clients send it as
# `Authorization: Bearer <token>`, or as `?token=<token>` on the URL — the
# browser WebSocket API cannot set headers, so the GUI uses the query form.
#IOD_TOKEN=

# --- MQTT bridge -----------------------------------------------------------
# Unset = no bridge, and iod runs perfectly well without one. Set it to publish
# this controller's IO to an external control system: Home Assistant, Node-RED,
# openHAB, a PLC.
#
# State (relays, contacts, the MCU link) is published RETAINED, so a subscriber
# that connects an hour late is immediately told the truth. Events (IR received,
# serial bytes) are NOT retained, because replaying "a remote was pressed" to
# whoever connects next would be a lie that re-fires automations.
#
#   <prefix>/<id>/status              online | offline   (retained, last will)
#   <prefix>/<id>/state/relay/0       ON | OFF           (retained)
#   <prefix>/<id>/state/contact/0     ON | OFF           (retained)
#   <prefix>/<id>/event/ir/rx         {"pronto": "...."}
#   <prefix>/<id>/event/serial/0/rx   {"b64": "...."}
#   <prefix>/<id>/cmd/relay/0/set     <- ON | OFF | TOGGLE
#   <prefix>/<id>/cmd/ir/0/send       <- pronto hex
#   <prefix>/<id>/cmd/serial/0/write  <- bytes
#   <prefix>/<id>/cmd/serial/0/baud   <- 115200
#   <prefix>/<id>/cmd/raw             <- any control-socket command, as JSON
#
# mqtt:// is plaintext (default port 1883); mqtts:// is TLS (default 8883).
#IOD_MQTT_URL=mqtt://10.0.0.5:1883

# Broker username/password.
#IOD_MQTT_USER=
#IOD_MQTT_PASS=

# TLS. A private/self-signed broker MUST set IOD_MQTT_CA to its CA PEM —
# a minimal firmware image ships no system trust store, and iod refuses to
# connect rather than skipping verification.
#IOD_MQTT_CA=/etc/openhc/broker-ca.pem

# Mutual TLS, if the broker asks for a client certificate.
#IOD_MQTT_CLIENT_CERT=/etc/openhc/client.pem
#IOD_MQTT_CLIENT_KEY=/etc/openhc/client.key

# Topic root and this controller's id. The id defaults to the hostname, which is
# already unique per unit (it carries the MAC).
#IOD_MQTT_PREFIX=openhc
#IOD_MQTT_CLIENT_ID=

# Home Assistant MQTT discovery prefix. Relays appear as switches and contacts
# as binary sensors, with no YAML written by hand. Set empty to disable.
#IOD_MQTT_DISCOVERY=homeassistant
