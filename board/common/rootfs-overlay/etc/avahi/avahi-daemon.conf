# Base avahi config for the headless controller. ohc-mdns rewrites host-name and
# allow-interfaces at runtime (openhc-<model>-<mac>, one interface).
[server]
use-ipv4=yes
use-ipv6=no
# enable-dbus is deliberately absent: ohc-mdns sets it per image. Only a
# D-Bus-built avahi accepts the key at all (an HC-800/CA-1/IO Extender avahi
# refuses to start on "Invalid configuration key"), and on the EA images —
# which have D-Bus for the audio feature — `no` stops shairport-sync's
# avahi-client from ever registering AirPlay.
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no

[rlimits]
rlimit-nproc=3
