# Base avahi config for the headless controller. ohc-mdns rewrites host-name and
# allow-interfaces at runtime (openhc-<model>-<mac>, one interface).
[server]
use-ipv4=yes
use-ipv6=no
# Every board ships D-Bus (common_defconfig), so avahi is always built with it.
# It must be ON: shairport-sync publishes AirPlay through avahi-client over the
# system bus, and `no` (what this file used to say) silently stopped that.
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no

[rlimits]
rlimit-nproc=3
