# Base avahi config for the headless controller. ohc-mdns rewrites host-name and
# allow-interfaces at runtime (<hostname>, one interface).
[server]
use-ipv4=yes
use-ipv6=no
# Every board ships D-Bus (common_defconfig), so avahi is always built with it.
# It must be ON: shairport-sync publishes AirPlay through avahi-client over the
# system bus, and `no` (what this file used to say) silently stopped that.
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
# IPv4 only, really: use-ipv6=no stops avahi answering over IPv6, but by default
# it still publishes the host's link-local IPv6 address in its IPv4 answers. A
# Mac or iPhone then prefers that fe80:: address, and AirPlay 2 over link-local
# breaks: the session sets up and the sender drops it once the PTP timing peers
# are exchanged — it connects, then nothing plays. Measured on the HC-800.
publish-aaaa-on-ipv4=no

[rlimits]
rlimit-nproc=3
