<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- openHC runs one shairport-sync per AirPlay endpoint. The package's own
     policy lets only the first own its name; every later one takes
     org.gnome.ShairportSync.i<pid> (and the MPRIS equivalent), so allow the
     prefixes. ohc-audiod (root) calls SetAirplayVolume on them (airplay.rs). -->
<busconfig>
  <policy user="root">
    <allow own_prefix="org.gnome.ShairportSync"/>
    <allow own_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow send_destination_prefix="org.gnome.ShairportSync"/>
    <allow send_destination_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
  </policy>
</busconfig>
