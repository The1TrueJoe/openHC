# /etc/powervr.ini — PowerVR SGX545 (Cedarview DDK 1.7.862890) runtime config.
#
# This file is read from the ABSOLUTE path /etc/powervr.ini: the string is
# hard-compiled into the i386 DDK blobs (confirmed: `strings libsrv_um.so`
# contains "/etc/powervr.ini"). The GLES/EGL stack runs i386-under-IA32 out of
# /opt/sgx-i386 via that sysroot's own ld-linux.so.2 — but it is NOT chrooted,
# so the apphint parser opens the real root's /etc/powervr.ini, i.e. THIS file
# (shipped into the x86_64 image through board/ea/common/rootfs-overlay). The
# copy the sgx545-um package drops into the sysroot's own /etc is therefore not
# the one read at runtime; this overlay copy is the effective one.
#
# -----------------------------------------------------------------------------
# WSEGL (window-system EGL) module selection.
#
# libIMGegl picks its WSEGL backend on IMGeglInitialize via the DDK apphint
# mechanism (PVRSRVGetAppHint, backed by this ini). The relevant apphint is the
# string key "WindowSystem" — present verbatim in libIMGegl.so. When it is set,
# libIMGegl dlopen()s that module name directly; when it is unset, it falls back
# to the compile-time default "libpvrPVR2D_DRIWSEGL.so" (also present in the
# binary), which is the X11/DRI backend. openHC has no X server and renders
# straight to the framebuffer, so we must force the LinuxFB backend instead.
#
# All five bundled backends (DRI/LINUXFB/FLIP/FRONT/BLIT) export the same
# WSEGL_GetFunctionTablePointer, so any can be loaded under any name. We name the
# LinuxFB one explicitly. The value is a bare soname resolved against the DDK's
# library path (run.sh passes --library-path usr/lib:lib); usr/lib has the
# libpvrPVR2D_LINUXFBWSEGL.so -> .so.1.7.862890 symlink. Matches libIMGegl's own
# default style (plain ".so", not a versioned name).
#
# The LinuxFB backend (libpvrPVR2D_LINUXFBWSEGL.so) opens the framebuffer by the
# hard-coded path "/dev/fb0" (confirmed via strings) — there is NO FBDEV/device
# env var to set. /dev/fb0 on this board is the ce5300 simplefb (720x480, 32bpp),
# which is what eglCreateWindowSurface(..., (EGLNativeWindowType)0, NULL) draws to.
WindowSystem=libpvrPVR2D_LINUXFBWSEGL.so

# Uploading textures through the 2D core is slower than memcpy here.
# (carried over from the sgx545-um package's powervr.ini)
DisableHWTextureUpload=1
