# Self-recovery settings — HC-800 only. Applied by S02sysctl.
#
# A BACKSTOP, not the primary mechanism. panic= is built into the kernel
# (CONFIG_CMDLINE in board/hc800/linux/hc800.fragment) so that it holds for a
# panic that happens before userspace exists — which this file, running from an
# init script, obviously cannot cover. It is repeated here because the built-in
# command line depends on CONFIG_CMDLINE_BOOL surviving whatever the kernel's
# x86 Kconfig does next, and a silently-dropped symbol would turn a box that
# reboots itself back into a box that hangs forever with nobody watching.
#
# 10 seconds: long enough for netconsole to get the trace onto the wire, short
# enough that nobody sits wondering whether it is coming back.
#
# THIS IS ONLY REASONABLE BECAUSE THE REBOOT LANDS SOMEWHERE ELSE. openHC is
# kexec'd on this board, never installed, so a panic reboot goes to GRUB and
# then the untouched Control4 image, which answers SSH. On a board where openHC
# is what is installed, the same setting would be an unattended panic loop —
# which is why this file lives under board/hc800 and not board/common.
kernel.panic = 10

# NOT panic_on_oops. This was 1 when openHC was a boot-once and an oops-driven
# reboot landed on the stock image — a clean way out of a half-dead kernel.
# openHC is now the default boot entry, so the same setting turns a survivable
# oops in some driver into a reboot into the identical oops, forever.
#
# A real panic still reboots (panic=10 above), because a panicked kernel is
# already dead and rebooting beats hanging. An oops is not that: the thread is
# gone, the rest of the system usually is not, and a box that stays up is a box
# you can still log into and read the trace from.
# kernel.panic_on_oops = 1
