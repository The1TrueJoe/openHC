# openHC ca1 — local MQTT broker for zigbee2mqtt (and anything else on-box).
# LAN-reachable, no auth: this box has no user accounts to speak of and sits
# behind whatever the home network already is. Tighten before this leaves a
# trusted network.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
