# Base avahi config for the headless controller. ohc-mdns rewrites host-name and
# allow-interfaces at runtime (openhomecontroller-<model>-<mac>, one interface).
[server]
use-ipv4=yes
use-ipv6=no
enable-dbus=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no

[rlimits]
rlimit-nproc=3
